<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GO Sports Dashboard</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>GO Sports Dashboard</h1>
            <p>Welcome to the GO Sports dashboard.</p>
            <div class="league-selector">
                <label for="league-select">League</label>

                <select id="league-select">
                    <option value="nfl" selected>NFL</option>
                    <option value="mlb" disabled>MLB</option>
                    <option value="nba" disabled>NBA</option>
                    <option value="nhl" disabled>NHL</option>
                </select>
        </div>
        </header>

        <section class="card">
            <h2>Backend Health</h2>

            <p id="health-status">
                Unknown
            </p>

            <button id="health-button">
                Check Backend
            </button>
        </section>
    </main>

    <script type="module" src="/dist/main.js"></script>
</body>
</html>
